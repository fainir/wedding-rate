[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health check: /api/auth/me returns 200 (logged in) or 401 (not logged in)
# — either means the server is up and the DB has been initialised.
[deploy.healthcheck]
path = "/api/auth/me"
timeout = 30
